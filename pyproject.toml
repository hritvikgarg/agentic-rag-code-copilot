[project]
name = "agentic-rag-code-copilot"
version = "0.1.0"
description = "Agentic RAG-based software engineering copilot for repository-aware code analysis and debugging (university GenAI course project)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15,<2",
    "fastembed>=0.8,<0.9",
    "google-genai>=2.24.0",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "onnx>=1.23.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: slow tests (e.g. building a real index); skipped in fast runs",
    "live: needs real models or network/API access; never run in CI",
    "llm_live: calls the hosted LLM (opt-in: COPILOT_RUN_LLM_LIVE=1 plus model and key); never CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["src/copilot"]
